<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Trip</title>

<style>

body{
  font-family:Arial;
  background:#eef2f7;
}

.container{
  width:400px;
  background:white;
  padding:30px;
  margin:50px auto;
  border-radius:10px;
}

input,textarea{
  width:100%;
  padding:12px;
  margin-top:15px;
}

button{
  width:100%;
  padding:12px;
  margin-top:20px;
  background:#1e3a5f;
  color:white;
  border:none;
}

</style>
</head>

<body>

<div class="container">

  <h1>Create Trip</h1>

  <input type="text" id="tripName" placeholder="Trip Name">

  <input type="date" id="startDate">

  <input type="date" id="endDate">

  <textarea id="description" placeholder="Trip Description"></textarea>

  <button onclick="createTrip()">
    Create Trip
  </button>

</div>

<script>

function createTrip(){

  let tripName =
  document.getElementById("tripName").value;

  if(tripName === ""){
    alert("Enter Trip Name");
  }
  else{
    alert("Trip Created");

    window.location.href = "my-trips.html";
  }

}

</script>

</body>
</html>
